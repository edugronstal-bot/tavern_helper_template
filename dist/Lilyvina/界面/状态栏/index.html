:root{--bg-deep:#0d0214;--bg-panel:#1a0a1a;--bg-card:#1e0e28;--border-glow:#6a2a8a;--border-bright:#8b008b;--text-primary:#f0b0ff;--text-secondary:#a070b0;--text-label:#b060c0;--accent-neon:#d070f0;--accent-pink:#e040a0;--progress-bg:#2a1040;--danger:#ff4060;--success:#40ff80;--locked:#3a1a4a;--unlocked:#d040e0}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg-deep);color:var(--text-primary);font-family:'Sarasa Gothic SC','Segoe UI',sans-serif;font-size:12px;line-height:1.4;overflow-x:hidden}.stat-dashboard{display:flex;flex-direction:column;gap:6px;padding:6px 8px;background:linear-gradient(180deg,#140520 0%,#0d0214 100%);border:1px solid var(--border-glow);border-radius:8px;box-shadow:0 0 20px rgba(106,42,138,0.3),inset 0 0 30px rgba(20,5,32,0.5)}.stat-header{display:flex;align-items:center;justify-content:center;padding:4px 0;border-bottom:1px solid var(--border-glow);gap:8px}.stat-header .title{font-size:14px;font-weight:700;background:linear-gradient(90deg,#d070f0,#f0b0ff,#d070f0);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;letter-spacing:2px}.stat-header .form-badge{font-size:11px;padding:2px 10px;border-radius:10px;background:var(--bg-card);border:1px solid var(--accent-neon);color:var(--accent-neon);font-weight:600}.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.stat-card{background:var(--bg-card);border:1px solid #3a1a5a;border-radius:6px;padding:6px 8px}.stat-card .card-title{font-size:11px;font-weight:700;color:var(--text-label);margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid #3a1a5a;display:flex;align-items:center;gap:4px}.stat-row{display:flex;justify-content:space-between;align-items:center;padding:2px 0}.stat-row .label{color:var(--text-secondary);font-size:11px}.stat-row .value{color:var(--text-primary);font-weight:600;font-size:12px}.stat-row .value.highlight{color:var(--accent-neon)}.progress-bar{width:100%;height:6px;background:var(--progress-bg);border-radius:3px;overflow:hidden;margin-top:2px}.progress-bar .fill{height:100%;border-radius:3px;transition:width 0.4s ease}.progress-bar .fill.core{background:linear-gradient(90deg,#8b008b,#d070f0)}.progress-bar .fill.stone{background:linear-gradient(90deg,#4a0080,#c040e0)}.progress-bar .fill.sword{background:linear-gradient(90deg,#c0a000,#ffe040)}.progress-bar .fill.damage{background:linear-gradient(90deg,#800020,#ff4060)}.progress-bar .fill.wing{background:linear-gradient(90deg,#200040,#a060d0)}.ability-tags{display:flex;flex-wrap:wrap;gap:4px;padding:4px 0}.ability-tag{font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid;font-weight:600;transition:all 0.2s}.ability-tag.unlocked{background:rgba(208,64,224,0.15);border-color:var(--unlocked);color:var(--unlocked);box-shadow:0 0 6px rgba(208,64,224,0.3)}.ability-tag.locked{background:transparent;border-color:var(--locked);color:#6a3a8a}.wing-visual{display:flex;align-items:center;gap:8px;padding:4px 0}.wing-icon{font-size:28px;color:var(--text-secondary);transition:color 0.3s}.wing-icon.active{color:var(--accent-neon);text-shadow:0 0 10px rgba(208,112,240,0.5)}.wing-icon.cosmic{color:#c0a0ff;text-shadow:0 0 15px rgba(192,160,255,0.6)}.wing-info{flex:1;display:flex;flex-direction:column;gap:2px}
